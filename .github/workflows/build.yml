name: Build Android APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Budujemy tylko moduł aplikacji
      - name: Build with Gradle
        run: ./gradlew :RealFitrexLauncher:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RealFitrex-APK
          # Szukamy APK wewnątrz folderu tego modułu
          path: 'RealFitrexLauncher/build/outputs/apk/debug/*.apk'
