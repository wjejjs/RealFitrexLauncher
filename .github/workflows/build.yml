name: Debug Project Structure
on: [push]
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List all files
        run: find . -maxdepth 3 -name "build.gradle*"
      - name: Show content of build.gradle files
        run: cat $(find . -maxdepth 3 -name "build.gradle*")
