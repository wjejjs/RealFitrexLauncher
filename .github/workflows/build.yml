name: Build Pojav-style Project
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build project
        # Używamy ./gradlew build, aby zbudować wszystkie moduły
        run: ./gradlew build

      - name: Upload everything
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          # Pakujemy wszystko z folderu build, tam powinny być wygenerowane pliki
          path: '**/build/'

